<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <g fill="#3b5a45" stroke="#3b5a45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Almohadilla principal hueca -->
    <path 
      d="M 28 78 
         C 20 78 18 68 25 58 
         C 32 48 40 44 50 44 
         C 60 44 68 48 75 58 
         C 82 68 80 78 72 78 
         C 64 78 59 70 50 70 
         C 41 70 36 78 28 78 Z" 
      stroke-width="7" 
      fill-rule="evenodd"
    />
    <!-- Hueco central de la almohadilla (para asegurar el recorte exacto) -->
    <path 
      d="M 50 54 
         C 44 54 38 60 36 67 
         C 42 63 46 62 50 62 
         C 54 62 58 63 64 67 
         C 62 60 56 54 50 54 Z" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="1"
    />

    <!-- Dedo 1 (Izquierda exterior) -->
    <ellipse cx="20" cy="42" rx="7" ry="11" transform="rotate(-30 20 42)" />
    <circle cx="17" cy="27" r="1.8" />

    <!-- Dedo 2 (Izquierda centro) -->
    <ellipse cx="38" cy="28" rx="8" ry="13" transform="rotate(-12 38 28)" />
    <circle cx="36" cy="11" r="2.2" />

    <!-- Dedo 3 (Derecha centro) -->
    <ellipse cx="62" cy="28" rx="8" ry="13" transform="rotate(12 62 28)" />
    <circle cx="64" cy="11" r="2.2" />

    <!-- Dedo 4 (Derecha exterior) -->
    <ellipse cx="80" cy="42" rx="7" ry="11" transform="rotate(30 80 42)" />
    <circle cx="83" cy="27" r="1.8" />
  </g>
</svg>
